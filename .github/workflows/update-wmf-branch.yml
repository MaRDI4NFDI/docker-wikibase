name: Update WMF Branch

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update WMF_BRANCH and REL_BRANCH
      id: check_version
      run: .github/scripts/update_branches.sh

    - name: Create Pull Request
      if: steps.check_version.outputs.needs_update == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update WMF_BRANCH to ${{ steps.check_version.outputs.latest_version }} and REL_BRANCH to ${{ steps.check_version.outputs.latest_rel }}"
        title: "Update MediaWiki branch to ${{ steps.check_version.outputs.latest_version }}"
        body: |
          This PR updates `clone_all.sh` to the latest Group 2 MediaWiki version and to the newest release branch below it that core and all extensions on `REL_BRANCH` have.
          
          **Changes:**
          - WMF_BRANCH: `${{ steps.check_version.outputs.current_version }}` → `${{ steps.check_version.outputs.latest_version }}`
          - REL_BRANCH: `${{ steps.check_version.outputs.current_rel }}` → `${{ steps.check_version.outputs.latest_rel }}`
          
          This update was automatically generated based on the latest Group 2 configuration from Wikimedia.
        branch: update-wmf-branch
        delete-branch: true
        base: main

    - name: No update needed
      if: steps.check_version.outputs.needs_update == 'false'
      run: |
        echo "WMF_BRANCH is already up to date (${{ steps.check_version.outputs.current_version }})"